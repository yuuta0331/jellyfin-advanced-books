changelog: >
  Add six-language localization for the Advanced Reader and plugin configuration:
  English, Japanese, German, French, Spanish and Simplified Chinese. Reader UI follows
  the Jellyfin/browser language automatically and keeps localized controls addressable
  through stable action identifiers. Add a repository-owned catalog icon and project
  banner, publish imageUrl and Books-category metadata in the Jellyfin repository
  manifest, and document repository-based installation and Catalog-discovered updates.
  Extend embedded-resource verification to the new localization bridge and add release
  validation for catalog metadata.