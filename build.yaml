changelog: >
  Improve Advanced Reader UI/UX on mobile and desktop. Add a per-user reader language
  override for Auto, English, Japanese, German, French, Spanish and Simplified Chinese
  while preserving Jellyfin/browser automatic detection. Replace ping-pong metadata
  scrolling with one-direction motion and an invisible reset, reorganize Reader Settings
  into collapsible Reading, Appearance, Behavior, Metadata and Language sections, and
  use mobile accordion behavior. Reduce mobile chrome clutter with compact floating
  controls, hide duplicate page-position information, and move secondary Fullscreen and
  Help actions into a localized overflow menu with accessible focus handling. Extend
  preference-schema, localization and UI regression validation for the new behavior.