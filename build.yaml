description: >
  Adds advanced book and comic features to Jellyfin 12, including Komga-compatible
  One-Shots, safe per-page CBZ delivery, paged/continuous reading, resume, a lazy
  thumbnail page navigator, per-user reader preferences, responsive auto-hiding
  reader controls, all-mode page scrubbing, and touch zoom.
