overview: "Komga-compatible book handling and an advanced comic reader for Jellyfin."
description: >
  Adds advanced book and comic features to Jellyfin 12, including Komga-compatible
  One-Shots, safe per-page CBZ delivery, paged/continuous reading, resume, a lazy
  thumbnail page navigator, per-user reader preferences, responsive auto-hiding
  reader controls, all-mode page scrubbing, and touch zoom.
category: "General"
owner: "yuuta0331"
artifacts:
- "Jellyfin.Plugin.AdvancedBooks.dll"
- "Jellyfin.AdvancedBooks.Core.dll"
changelog: >
  Harden JavaScript Injector startup recovery. Validate all embedded reader assets
  before replacing existing registrations, keep the required Core transactional,
  and allow optional Progress/Preferences/Navigator/Gestures bridges to fail soft
  without removing the rest of the reader. Log the actual loaded Advanced Books
  assembly version, informational version, and DLL path at startup. CI and release
  workflows now validate the five reader resources from the built plugin DLL
  itself with strict UTF-8 and size checks, in addition to source JavaScript checks.
