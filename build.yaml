changelog: >
  Integrate Advanced Reader more deeply with Jellyfin and improve reading interaction.
  Add browser/mobile Back handling plus an optional replacement for Jellyfin Book
  Resume/Start-over actions, centered SVG navigation icons, focal-point pinch/wheel and
  double-tap zoom, one-finger pan after zoom, compact two-stage bottom navigation,
  layout-aware left/right and top/bottom click/tap navigation with smooth transitions,
  and desktop grab-to-pan/scroll behavior. Extend six-language help, integration guards
  and smoke-test documentation for the new controls.