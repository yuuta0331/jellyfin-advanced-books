changelog: >
  Show Jellyfin book title, authors, series and year in the Advanced Reader.
  Fix progress resume for played books and close-time/in-flight save races so the
  latest reached page is queued and synchronized reliably. Replace the desktop
  scrubber resize cursor with a normal pointer. Add Komga-style smart double-page
  spreads with first/last and landscape pages shown singly, persisted black/gray/
  white backgrounds, optional page-transition animation, optional touch gestures,
  and contextual keyboard/gesture help. Keep the Core JavaScript below the
  JavaScript Injector size limit and extend preference schema migration/tests.