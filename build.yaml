overview: "Komga-compatible book handling and an advanced comic reader for Jellyfin."
description: >
  Adds advanced book and comic features to Jellyfin 12, including Komga-compatible
  One-Shots, safe per-page CBZ delivery, paged/continuous reading, cross-client
  progress, book metadata, smart spreads, reader appearance preferences, page
  navigation, responsive controls, all-mode page scrubbing, and touch zoom.
