changelog: >
  Fix a critical Continuous/Webtoon rendering race that could append duplicate
  page images to the same slot and display them side by side. Enforce a strict
  one-image-per-page DOM invariant with generation guards so stale asynchronous
  loads cannot resurrect evicted images. Make double-page spreads stable by
  determining page orientation before rendering instead of displaying a guessed
  spread and correcting it afterward. Ignore __MACOSX and AppleDouble image-like
  entries in CBZ/ZIP archives, disable browser caching for full-page responses,
  and verify the served page index in the Web reader. Add configurable reader
  metadata visibility for title, authors, series, issue and year, plus automatic
  overflow scrolling that can be enabled or disabled per Jellyfin user.