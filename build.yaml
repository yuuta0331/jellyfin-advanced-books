overview: "Advanced comic, manga, magazine and book reader for Jellyfin 12."
description: >
  Adds advanced comic, manga, magazine and book features to Jellyfin 12, including
  Komga-compatible One-Shots, safe per-page CBZ/ZIP delivery, smart paged/continuous/
  webtoon reading, cross-client progress and preferences, metadata controls, gestures,
  a localized reader interface, and optional direct Komga API metadata synchronization.
