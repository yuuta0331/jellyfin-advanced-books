changelog: >
  Polish Advanced Reader interactions. Hidden chrome now ignores minor desktop
  pointer jitter, deliberate movement restores it, and hovering visible chrome
  pauses auto-hide. The page scrubber now shows a debounced authenticated
  thumbnail preview while dragging and stays pinned for long scrubs. Reduce
  GitHub Actions cost by deferring draft CI, cancelling stale PR runs, removing
  duplicate main CI builds, and triggering releases only from build.yaml changes.
