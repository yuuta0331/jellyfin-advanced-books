changelog: >
  Fix Advanced Reader integration disappearing when the JavaScript Injector
  registration becomes corrupted. Register the reader core, progress,
  preferences, navigator, and gestures as five independent bounded scripts
  instead of one large combined payload. Remove the legacy combined entry on
  startup, validate embedded UTF-8/control characters, roll back partial
  registrations, and guard per-script size in CI and release validation.
