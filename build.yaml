changelog: >
  Fix Page-grid thumbnails that could remain permanently unloaded after scrolling.
  Visible cards now use direct viewport scanning plus a watchdog, timeout recovery,
  128px shared thumbnail caching, and a bounded two-request full-page fallback.
  Fix the scrub-preview loading layout so the spinner/error stays inside the
  thumbnail frame, replace the Advanced Reader launch glyph with a dedicated
  reader-mode icon, and improve mixed-size Vertical/Webtoon books with learned
  page aspect ratios, viewport-marker current-page tracking, explicit scroll
  anchoring, and preserved geometry across page eviction and viewport changes.
