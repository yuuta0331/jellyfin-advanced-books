overview: "Komga-compatible book handling and an advanced comic reader for Jellyfin."
description: >
  Adds advanced book and comic features to Jellyfin 12, including Komga-compatible
  One-Shots, safe per-page CBZ delivery, paged/continuous reading, resume, a lazy
  thumbnail page navigator, per-user reader preferences, responsive auto-hiding
  reader controls, all-mode page scrubbing, and touch zoom.
category: "General"
owner: "yuuta0331"
artifacts:
- "Jellyfin.Plugin.AdvancedBooks.dll"
- "Jellyfin.AdvancedBooks.Core.dll"
changelog: >
  Improve desktop and mobile reader responsiveness. Use measured viewport sizing
  for Fit modes and migrate the legacy Fit Height default to Fit Screen, keep
  mobile controls square, anchor scrub previews to the active finger/pointer,
  reduce preview latency, cache archive metadata, and reuse compatible larger
  thumbnail cache entries. Stabilize Webtoon/Vertical scrolling with earlier and
  directional prefetch, decoded page geometry, and scroll-anchor compensation.
  Fix Pages-grid lazy loading with a viewport-priority queue and explicit scroll
  fallback, and isolate two-finger pinch zoom from page pan/scroll movement.
