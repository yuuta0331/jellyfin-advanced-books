changelog: |
  - Import metadata stored directly in Komga through its REST API without requiring ComicInfo.xml.
  - Match Komga Books to Jellyfin Books by exact normalized file path with configurable Docker/host path mappings.
  - Sync title, summary, series, dates, issue, genres, publisher, tags, ISBN and author roles while retaining Komga provider IDs.
  - Add admin connection testing, Sync now, a manual Scheduled Task and optional post-library-scan synchronization.
  - Reject ambiguous duplicate paths and Komga credentials that hide full Book paths; avoid mapping unsupported fields into unrelated Jellyfin properties.
