name: Temporary catalog changelog branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete merged branch
        shell: bash
        run: |
          set -euo pipefail
          branch="fix/catalog-changelog-formatting"
          endpoint="repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          if gh api "$endpoint" >/dev/null 2>&1; then
            gh api --method DELETE "$endpoint"
            echo "Deleted $branch"
          else
            echo "Already absent: $branch"
          fi
