name: Temporary release-note branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-v015-release-notes.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete merged release-note branch
        shell: bash
        run: |
          set -euo pipefail
          endpoint="repos/${GITHUB_REPOSITORY}/git/refs/heads/docs/structured-release-notes"
          if gh api "$endpoint" >/dev/null 2>&1; then
            gh api --method DELETE "$endpoint"
            echo "Deleted docs/structured-release-notes"
          else
            echo "Branch already absent"
          fi
