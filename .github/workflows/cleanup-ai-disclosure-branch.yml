name: Temporary AI disclosure branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-ai-disclosure-branch.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete merged branch
        shell: bash
        run: |
          set -euo pipefail
          endpoint="repos/${GITHUB_REPOSITORY}/git/refs/heads/docs/ai-usage-disclosure"
          if gh api "$endpoint" >/dev/null 2>&1; then
            gh api --method DELETE "$endpoint"
            echo "Deleted docs/ai-usage-disclosure"
          else
            echo "Branch already absent"
          fi
