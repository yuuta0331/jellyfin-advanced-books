name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate reader JavaScript syntax
        run: node --check src/Jellyfin.Plugin.AdvancedBooks/Reader/advancedBooksReader.js

      - name: Restore
        run: dotnet restore jellyfin-advanced-books.slnx

      - name: Build
        run: dotnet build jellyfin-advanced-books.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test jellyfin-advanced-books.slnx --configuration Release --no-build

      - name: Package development plugin
        run: |
          mkdir -p artifacts/AdvancedBooks
          cp src/Jellyfin.Plugin.AdvancedBooks/bin/Release/net10.0/Jellyfin.Plugin.AdvancedBooks.dll artifacts/AdvancedBooks/
          cp src/Jellyfin.Plugin.AdvancedBooks/bin/Release/net10.0/Jellyfin.AdvancedBooks.Core.dll artifacts/AdvancedBooks/
          cd artifacts
          zip -r AdvancedBooks-dev.zip AdvancedBooks

      - name: Upload development plugin
        uses: actions/upload-artifact@v4
        with:
          name: AdvancedBooks-dev
          path: artifacts/AdvancedBooks-dev.zip
          if-no-files-found: error
