name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: advanced-books-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate reader JavaScript syntax
        run: |
          for file in src/Jellyfin.Plugin.AdvancedBooks/Reader/*.js; do
            node --check "$file"
          done

      - name: Validate release helper syntax
        run: python -m compileall -q scripts tests/test_release_scripts.py

      - name: Validate release metadata
        id: release_meta
        run: >-
          python scripts/validate_release.py
          --github-output "$GITHUB_OUTPUT"
          --changelog-output artifacts/changelog.txt

      - name: Test release helpers
        run: python -m unittest discover -s tests -p 'test_release_*.py' -v

      - name: Restore
        run: dotnet restore jellyfin-advanced-books.slnx

      - name: Build
        run: dotnet build jellyfin-advanced-books.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test jellyfin-advanced-books.slnx --configuration Release --no-build

      - name: Package development plugin twice
        env:
          VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          INPUT_DIR="src/Jellyfin.Plugin.AdvancedBooks/bin/Release/net10.0"
          python scripts/package_plugin.py --input-dir "$INPUT_DIR" --output-dir artifacts/release --version "$VERSION"
          python scripts/package_plugin.py --input-dir "$INPUT_DIR" --output-dir artifacts/reprocheck --version "$VERSION"

      - name: Verify reproducible package
        env:
          VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          cmp "artifacts/release/AdvancedBooks_${VERSION}.zip" "artifacts/reprocheck/AdvancedBooks_${VERSION}.zip"
          cmp "artifacts/release/AdvancedBooks_${VERSION}.zip.md5" "artifacts/reprocheck/AdvancedBooks_${VERSION}.zip.md5"
          cmp "artifacts/release/AdvancedBooks_${VERSION}.zip.sha256" "artifacts/reprocheck/AdvancedBooks_${VERSION}.zip.sha256"
          unzip -t "artifacts/release/AdvancedBooks_${VERSION}.zip"
          unzip -l "artifacts/release/AdvancedBooks_${VERSION}.zip"

      - name: Upload development plugin
        uses: actions/upload-artifact@v4
        with:
          name: AdvancedBooks-dev
          path: |
            artifacts/release/AdvancedBooks_*.zip
            artifacts/release/AdvancedBooks_*.zip.md5
            artifacts/release/AdvancedBooks_*.zip.sha256
            artifacts/changelog.txt
          if-no-files-found: error
