name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore jellyfin-advanced-books.slnx

      - name: Build
        run: dotnet build jellyfin-advanced-books.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test jellyfin-advanced-books.slnx --configuration Release --no-build
