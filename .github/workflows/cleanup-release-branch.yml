name: Temporary release branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-release-branch.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete merged release branch
        shell: bash
        run: |
          set -euo pipefail
          endpoint="repos/${GITHUB_REPOSITORY}/git/refs/heads/release/v0.15.0.0"
          if gh api "$endpoint" >/dev/null 2>&1; then
            gh api --method DELETE "$endpoint"
            echo "Deleted release/v0.15.0.0"
          else
            echo "Branch already absent"
          fi
